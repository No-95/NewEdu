name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env.production for build
        run: |
          printf '%s\n' \
            'NEXT_PUBLIC_CONVEX_URL=https://adept-tapir-159.convex.cloud' \
            'NEXT_PUBLIC_APP_URL=https://hdpedu.com' \
            > .env.production

      - name: Build OpenNext bundle
        run: node scripts/build-cloudflare-prod.mjs

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec opennextjs-cloudflare deploy -- --keep-vars
